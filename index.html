<body>
  <!-- ── Left: editor column ───────────────────────────────────────────── -->
  <div id="editor-container">

    <div id="toolbar">

      <select id="theme-select">

        <button class="docs-tab" data-tab="patterns">Patterns</button>
        <button class="docs-tab" data-tab="functions">Functions</button>
        <button class="docs-tab" data-tab="guide">Guide</button>
        <button class="docs-tab" data-tab="changelog">Changelog</button>

      </div>

    <div id="editor-wrap"></div>

    <div id="log-handle"></div>

  </div>

  <!-- ── Right: crashpanel ─────────────────────────────────────────────── -->
  <div id="crash-panel">
    <div id="cp-header">
      <div class="cp-title">WebFoxDot</div>
      <div class="cp-subtitle">scsynth ▸ WASM</div>
    </div>

    <div class="cp-section">
      <h3>Clock</h3>
      <div id="cp-beat">—</div>
      <div id="cp-beat-sub" style="text-align:center;font-size:9px;color:var(--text-2);margin-bottom:4px;">◦◦◦◦</div>
      <div class="cp-row">
        <span class="cp-label">BPM</span>
        <span class="cp-value green" id="cp-bpm-val">120</span>

    </div>

    <div class="cp-section">
      <h3>Scale</h3>

      <select class="cp-select" id="cp-root-sel"></select>
    </div>

    <div class="cp-section">
      <h3>Composition</h3>
      <div id="cp-autoplay">autoplay: off</div>
      <div id="cp-parts"></div>
    </div>

    <div class="cp-section" style="flex:1;overflow-y:auto;min-height:0">
      <h3>Players</h3>
      <div id="cp-players"></div>
    </div>
  </div>

  <!-- ── Scripts — load order matters ─────────────────────────────────── -->
  <script src="lib/codemirror/codemirror.min.js"></script>
  <script src="lib/codemirror/python.min.js"></script>
  <script src="lib/codemirror/overlay.js"></script>
  <script src="lib/codemirror/show-hint.js"></script>
  <script src="lib/codemirror/matchbrackets.js"></script>
  <script src="lib/codemirror/closebrackets.js"></script>
  <script src="lib/codemirror/active-line.js"></script>
  <script src="lib/codemirror/comment.js"></script>
  <script src="lib/codemirror/foldcode.js"></script>
  <script src="lib/codemirror/foldgutter.js"></script>
  <script src="js/editor/foxdot_mode.js"></script>

  <script type="module">
    import { SuperSonic }     from './lib/dist/supersonic.js';
    import { Clock }          from './js/engine/clock.js';
    import { Player, setSuperSonic, setWarn, PLAYER_GROUP, FX_GROUP,
             drop as _dropFn, unsolo as _unsoloFn, soloRnd as _soloRndFn } from './js/engine/player.js';
    import { Scale, Root }    from './js/engine/scale.js';
    import { SYNTH_DEFS, makeSynth } from './js/synths/registry.js';
    import { PRand, PWhite, PWalk, PDur, PPing,
             PStutter, PAlt, PShuf, PBern, PCoin,
             PEuclid, PRange, PStep, PSine, PTri,
             PChain, PMarkov, _group,
             Pacc, PSwing, PBin, PFDur, PLife } from './js/patterns/sequences.js';
    import { _var, _linvar, _sinvar, _expvar, _fi, _fo, _fb, setClockRef } from './js/patterns/timevars.js';
    import { loadSamples, PlayStringCall,
             loadSampleFromURL, loadPackFromURL } from './js/engine/sampler.js';
    import { transpile, applyRenames }   from './js/editor/transpiler.js';
    import { triggerAutocomplete }       from './js/editor/autocomplete.js';
    import { inspect, initInspect }      from './js/editor/inspect.js';
    import { incrementValue, stopPlayerAtCursor,
             soloPlayerAtCursor, soloDropAtCursor } from './js/editor/keybindings.js';
    import { initCrashPanel }            from './js/ui/crashpanel.js';
    import { initDocs, toggleDocs, openDocs, VERSION, examplesAsCode } from './js/ui/docs.js';
    import { initSections, runSection, cancelSection,
             getSections, jumpToActive, isAutoplaying } from './js/engine/sections.js';
    import { initCollab }                from './js/collab/collab.js';
    import * as UGENS                    from './js/scsynth/ugens.js';
    import { defsynth, initDefsynth, userSynths } from './js/scsynth/defsynth.js';

    // ── Log ──────────────────────────────────────────────────────────────────
    const logEl = document.getElementById('log');
    function log(msg, type = 'info') {
        const d = document.createElement('div');
        d.className = 'log-' + type;
        d.textContent = `[${new Date().toLocaleTimeString('fr-FR')}] ${msg}`;
        logEl.appendChild(d);
        logEl.scrollTop = logEl.scrollHeight;
    }
    // Returns an updater fn that edits the same log line in place.
    function logLive(msg, type = 'info') {
        const d = document.createElement('div');
        d.className = 'log-' + type;
        d.textContent = `[${new Date().toLocaleTimeString('fr-FR')}] ${msg}`;
        logEl.appendChild(d);
        logEl.scrollTop = logEl.scrollHeight;
        return (newMsg, newType) => {
            if (newType) d.className = 'log-' + newType;
            d.textContent = `[${new Date().toLocaleTimeString('fr-FR')}] ${newMsg}`;
            logEl.scrollTop = logEl.scrollHeight;
        };
    }

    // ── Clock + TimeVar ───────────────────────────────────────────────────────
    const clock = new Clock();
    clock._onBpm = (bpm) => {
        const inp = document.getElementById('bpm-input');
        if (inp && Number(inp.value) !== bpm) inp.value = bpm;
        log(`Clock.bpm = ${bpm}`, 'ok');
    };
    setClockRef(clock);
    setWarn((msg) => log(msg, 'warn'));

    // ── Eval context ──────────────────────────────────────────────────────────
    const SYNTHS = Object.fromEntries(Object.keys(SYNTH_DEFS).map(n => [n, makeSynth(n)]));

    const ScaleProxy = new Proxy(Scale, {
        set(t, k, v) { t[k] = v; if (k === 'default') log(`Scale.default = ${JSON.stringify(v)}`, 'ok'); return true; }
    });
    const RootProxy = new Proxy(Root, {
        set(t, k, v) { t[k] = v; if (k === 'default') log(`Root.default = ${v}`, 'ok'); return true; }
    });

    function __p(name) { return clock.getPlayer(name, Player); }

    // Collab API — populated after initCollab() if ?session= is in the URL
    let _collab = null;
    let _remoteEval = false; // prevent re-broadcast of received evals

    function buildCtx() {
        return {
            Clock: new Proxy(clock, {
                set(t, k, v) { if (k === 'bpm') t.bpm = v; else t[k] = v; return true; }
            }),
            Scale: ScaleProxy,
            Root:  RootProxy,
            __stopAll: () => { clock._players.forEach(p => p.stop()); },
            cancelSection,
            __p,
            ...SYNTHS,
            PRand, PWhite, PWalk, PDur, PPing,
            PStutter, PAlt, PShuf, PBern, PCoin,
            PEuclid, PRange, PStep, PSine, PTri,
            PChain, PMarkov, Pacc, PSwing, PBin, PFDur, PLife,
            _var, _linvar, _sinvar, _expvar,
            fi: _fi, fo: _fo, fb: _fb,
            __group: _group,
            ...UGENS,            // SinOsc, Saw, RLPF, Out, EnvGen, Env, Pan2, …
            ...userSynths,       // synths defined live via defsynth()
            defsynth,
            rest:   () => null,
            play:   (pattern, opts = {}) => new PlayStringCall(pattern, opts),
            loadsample: (char, url) => loadSampleFromURL(char, url)
                .then(ok => log(ok ? `sample "${char}" loaded` : `sample "${char}": all URLs failed`, ok ? 'ok' : 'error'))
                .catch(e => log(`loadsample "${char}": ${e.message}`, 'error')),
            loadpack: (url) => {
                const update = logLive('loadpack: fetching…');
                return loadPackFromURL(url, (done, total) => {
                    update(`loadpack: ${done}/${total} samples…`);
                })
                .then(n => update(n ? `loadpack: ${n} chars loaded ✓` : 'loadpack: 0 chars loaded (all failed)', n ? 'ok' : 'error'))
                .catch(e => update(`loadpack: ${e.message}`, 'error'));
            },
            print:  (...a) => log(a.join(' ')),
            drop:   (playTime = 14, dropTime = 2, nbloop = 1) => _dropFn(clock, playTime, dropTime, nbloop, (m) => log(m, 'info')),
            unsolo: () => _unsoloFn(clock),
            soloRnd: (time = 8) => _soloRndFn(clock, time, (m) => log(m, 'info')),
        };
    }

    function runCode(raw, { fromRemote = false } = {}) {
        let js = transpile(raw.trim());
        js = applyRenames(js);
        log(`eval: ${raw.trim().split('\n')[0].slice(0, 70)}`, 'eval');
        const ctx = buildCtx();
        try {
            new Function(...Object.keys(ctx), js)(...Object.values(ctx));
        } catch (e) {
            log(`Error: ${e.message}`, 'error');
            console.error('transpiled:\n' + js, e);
        }
        // Broadcast to peers (skip if this eval came from a peer)
        if (!fromRemote && _collab) {
            const user = JSON.parse(localStorage.getItem('wfd-user') || '{"name":"?","color":"#888"}');
            _collab.broadcastEval(raw, [], user.name, user.color, clock.now());
        }
    }

    // ── Block runner ──────────────────────────────────────────────────────────
    function runBlockAtCursor() {
        const cursor = editor.getCursor();
        // #@ section headers — intercept before normal block logic
        const cursorLine = editor.getLine(cursor.line).trim();
        if (cursorLine.startsWith('#@#@')) return; // track header — fold only
        if (cursorLine.startsWith('#@')) {
            flashLines(cursor.line, cursor.line);
            runSection(cursor.line);
            return;
        }
        let s = cursor.line, e = cursor.line;
        const n = editor.lineCount();
        while (s > 0 && editor.getLine(s - 1).trim()) s--;
        while (e < n - 1 && editor.getLine(e + 1).trim()) e++;
        const block = editor.getRange({ line: s, ch: 0 }, { line: e, ch: editor.getLine(e).length }).trim();
        if (block) {
            flashLines(s, e);
            runCode(block);
            recCapture(block);
        }
    }

    function runSelected() {
        const sel = editor.getSelection().trim();
        if (sel) {
            const from = editor.getCursor('from');
            const to   = editor.getCursor('to');
            flashLines(from.line, to.line);
            runCode(sel);
            recCapture(sel);
        } else {
            runBlockAtCursor();
        }
    }

    // ── Composition recording ─────────────────────────────────────────────────
    // Capture each user eval with its beat offset; on stop, generate a #@ set.
    let _rec = { on: false, startBeat: 0, events: [] };
    function recCapture(code) {
        if (_rec.on) _rec.events.push({ beat: clock.now() - _rec.startBeat, code });
    }
    function buildComposition(events, bpm) {
        if (!events.length) return null;
        const GAP = 4;                                   // beats of silence → new section
        const names = ['intro', 'build', 'peak', 'break', 'drop', 'outro'];
        const snap = (d) => Math.max(4, Math.round(d / 4) * 4);
        const sections = [];
        let cur = { codes: [events[0].code], start: events[0].beat }, ci = 0;
        for (let i = 1; i < events.length; i++) {
            if (events[i].beat - events[i - 1].beat > GAP) {
                cur.dur  = snap(events[i].beat - cur.start);
                cur.name = ci < names.length ? names[ci] : 'part' + (ci + 1);
                sections.push(cur); ci++;
                cur = { codes: [], start: events[i].beat };
            }
            cur.codes.push(events[i].code);
        }
        cur.dur = 16; cur.name = ci < names.length ? names[ci] : 'part' + (ci + 1);
        sections.push(cur);
        let s = '#@#@ recorded\n\n';
        for (const sec of sections) s += `#@${sec.name}(${sec.dur})\n${sec.codes.join('\n')}\n\n`;
        return s + '#@end(16)\n';
    }
    function toggleRec() {
        const btn = document.getElementById('btn-rec');
        if (!_rec.on) {
            _rec = { on: true, startBeat: clock.now(), events: [] };
            btn.classList.add('recording'); btn.textContent = '● rec';
            log('recording composition — play your set, then press rec again', 'warn');
        } else {
            _rec.on = false;
            btn.classList.remove('recording'); btn.textContent = 'rec';
            const compo = buildComposition(_rec.events, clock.bpm);
            if (!compo) { log('recording empty — nothing captured', 'warn'); return; }
            const last = editor.lastLine();
            editor.replaceRange('\n\n# ══ recorded composition (run the #@ parts) ══\n' + compo,
                { line: last, ch: editor.getLine(last).length });
            log(`composition recorded — ${_rec.events.length} evals → appended to the buffer`, 'ok');
        }
    }

    // ── Flash highlight ───────────────────────────────────────────────────────
    function flashLines(from, to) {
        const marks = [];
        for (let i = from; i <= to; i++) {
            marks.push(editor.addLineClass(i, 'background', 'flash-highlight'));
        }
        setTimeout(() => marks.forEach((_, i) => editor.removeLineClass(from + i, 'background', 'flash-highlight')), 350);
    }

    // ── Boot ─────────────────────────────────────────────────────────────────
    const SYNTHDEFS_TO_LOAD = [
        'fd_dbass', 'fd_saw', 'fd_sine', 'fd_rsin', 'fd_donk',
        'fd_pluck', 'fd_pulse', 'fd_blip', 'fd_fm', 'fd_bell', 'fd_pads',
        'fd_bass', 'fd_prophet',
        'fd_sampler', 'fd_fx_chain',
    ];

    async function bootAudio() {
        const dot = document.getElementById('status-dot');
        const btn = document.getElementById('btn-boot');
        dot.className = 'booting';
        btn.disabled = true;
        btn.textContent = 'booting…';
        log('Booting scsynth WASM…');
        try {
            const sc = new SuperSonic({
                baseURL:         './lib/dist/',
                synthdefBaseURL: './synthdefs/compiled/',
                maxNodes:        1024,  // matches node-tree-mirror cap; ample for live coding
                // Firefox crashes on shared-memory WebAssembly.Memory.grow(), which
                // SuperSonic calls when the sample buffer pool needs to expand.
                // Set the pool's initial size == maximum so it's allocated once at
                // boot and never grows. 128MB holds a full pack + lazy built-ins.
                memory: {
                    bufferPoolSize:    128 * 1024 * 1024,
                    maxBufferPoolSize: 128 * 1024 * 1024,
                },
            });
            await sc.init();
            log('scsynth started ✓', 'ok');

            // Group 1 (DefaultGroup) is NOT auto-created in this WASM build — use group 0 (RootNode).
            // PLAYER_GROUP head of RootNode, FX_GROUP after PLAYER_GROUP.
            sc.send('/g_new', PLAYER_GROUP, 0, 0);
            sc.send('/g_new', FX_GROUP,     3, PLAYER_GROUP);
            log(`  groups created: playerGroup=${PLAYER_GROUP}, fxGroup=${FX_GROUP}`, 'ok');

            const synthStatus = document.getElementById('synth-status');
            for (const name of SYNTHDEFS_TO_LOAD) {
                synthStatus.textContent = `loading ${name}…`;
                try {
                    await sc.loadSynthDef(name);
                    log(`  ${name} ✓`, 'ok');
                } catch (e) {
                    log(`  ${name} FAILED: ${e.message}`, 'error');
                    console.error(`loadSynthDef ${name}:`, e);
                }
            }
            synthStatus.textContent = 'reading sample manifest…';
            try {
                const charCount = await loadSamples(sc);
                if (charCount > 0) {
                    log(`  sample bank ready ✓ (${charCount} chars, lazy-loaded on first use)`, 'ok');
                } else {
                    log('  no sample bank — run setup_samples.py to configure one', 'warn');
                }
            } catch (e) {
                log(`  sample manifest FAILED: ${e.message}`, 'error');
                console.error('loadSamples:', e);
            }
            synthStatus.textContent = '';

            setSuperSonic(sc);
            initDefsynth(sc, (name) => log(`synth "${name}" defined ✓`, 'ok'));
            clock.start();

            dot.className = 'ready';
            btn.textContent = 'booted';
            btn.classList.add('booted');
            document.getElementById('btn-run').disabled  = false;
            document.getElementById('btn-stop').disabled = false;
            log('Ready. Clock running.', 'ok');
        } catch (e) {
            log(`Boot failed: ${e.message}`, 'error');
            console.error(e);
            document.getElementById('status-dot').className = '';
            btn.disabled = false;
            btn.textContent = 'retry boot';
        }
    }

    // ── Editor ────────────────────────────────────────────────────────────────
    const INITIAL_CODE = `# WebFoxDot  |  Ctrl+Enter: run block  |  Alt+X: comment+stop  |  Alt+S: solo  |  Ctrl+;: stop all  |  Alt+↑↓: nudge number
# Run a block: put the cursor inside it and press Ctrl+Enter. Edit + re-run live.

Clock.bpm = 120
Scale.default = "minor"
Root.default = 0


# ══ 1. DRUMS — play()  ( . = rest, brackets nest ) ══════════════════════
#   (xo) together   [xo] subdivide   {xo} random   <xo> alternate
b1 >> play(x.o., amp=0.9)
# b2 >> play(x-o-, lpf=1500, reverb=0.3)        # FX work on drums
# b3 >> play(<x.><[--]><x.>, amp=0.8)           # brackets nest
# b4 >> play(x-o-).sometimes("stutter", 2)       # probabilistic
# b5 >> play(x., amp=Pacc("tresillo"))     # accent groove
# b6 >> play(x-o-, amplify=PSwing(0.3))          # swing feel


# ══ 2. SYNTHS — [seq]  (chord)  per-param groups ════════════════════════
p1 >> dbass([0, -3, 0, 4], oct=4, amp=0.9, cutoff=linvar([400, 2000], [8, 8]), rq=0.4)

# (a,b,c) = chord ;  grouped params zip across voices
# p2 >> pluck([0, (0,4,7), 4, 7], oct=4, dur=0.5, pan=(-1,1))
# p3 >> fm([0, 7, 5, 3], oct=4, ratio=2, index=var([2, 9], [4, 4]))

# bell · pads · bass · prophet · pulse(width) · blip(rate) · saw · sine · rsin · donk
# p4 >> bell([0, 4, 7], oct=5, rate=2, amp=0.5)
# p5 >> pads([0, 3, 5], oct=4, dur=4, amp=0.5, reverb=0.4)


# ══ 3. f* PARAMETER ENVELOPES — "_" suffix, per-note, FX params only ════
# fi=fade in  fo=fade out  fb=bounce/wobble   sig: f(beats, from, to)
# p7 >> saw([0, 4], oct=4, dur=1, lpf_=fi(0.5, 400, 5000), amp=0.5)
# p8 >> saw([0, 3], oct=3, dur=1, lpf_=fb(0.25, 300, 3000), amp=0.5)


# ══ 4. FX — append to any player (lpf hpf reverb echo tanh crush) ═══════
# crush = bitcrush (bits=levels, srate=downsample Hz)
# p1 >> dbass([0,-3,0,4], oct=4, crush=0.6, bits=4, echo=0.3, echo_time=0.375)


# ══ 5. DEFINE A SYNTH LIVE — defsynth() (no SuperCollider needed) ═══════
# Run this block once, then play "mylead" like any built-in.
# defsynth("mylead", { cutoff: 2000, rq: 0.4 }, ({ out, note, amp, sus, pan, attack, release, cutoff, rq }) => {
#   const freq = note.midicps()
#   const env  = EnvGen.ar(Env.linen(attack, sus, release), { doneAction: 2 })
#   const sig  = RLPF.ar(Saw.ar(freq), cutoff, rq).mul(env).mul(amp)
#   Out.ar(out, Pan2.ar(sig, pan))
# })
# p2 >> mylead([0, 4, 7, 4], oct=4, cutoff=3000, dur=0.5)


# ══ 6. EXTERNAL SAMPLES — load from any CORS-friendly URL ═══════════════
# loadpack("https://cdn.jsdelivr.net/gh/CrashServer/webfoxdot-kit@v1/pack.json")
# loadsample("K", "https://raw.githubusercontent.com/user/repo/main/kick.wav")
# b1 >> play(K.K.K.K., amp=0.9)


# ══ 7. PERFORMANCE ══════════════════════════════════════════════════════
# p1.every(8, 'stutter', 4)
# p1.solo(8)        # solo 8 beats then restore   |   soloRnd(8)
# drop(14, 2)       # bar-aligned drop   (Alt+S solo · Ctrl+Alt+S unsolo)


# ══ 8. SECTION SEQUENCER — cursor on a #@ line, Ctrl+Enter ══════════════
# sections auto-advance after their beat count | commented "# p1 >>" = stop
#@#@ my_set

#@intro(16)
# p1 >> dbass([0, -3, 0, 4], oct=4, amp=0.9)
# b1 >> play(X.oX.o, amp=0.9)

#@verse(32)
# p1 >> dbass([0, -3, 5, 4], oct=4, amp=0.9)
# p5 >> pads([0, 3, 5], oct=4, dur=4, reverb=0.4)
# # b1 >>

#@loop(8, verse:3, fill:1)

#@fill(4, verse:1)
# b1 >> play(<X.oX.> [XoX] X.X., crush=0.5, bits=4)

#@end(8)
`;

    // Session mode (?session=) is persisted by Yjs. In solo mode, autosave the
    // buffer to localStorage so edits survive a page refresh.
    const _sessionSlug = new URLSearchParams(location.search).get('session');
    const SOLO_KEY = 'wfd-buffer';
    const _startValue = (!_sessionSlug && localStorage.getItem(SOLO_KEY)) || INITIAL_CODE;

    const editor = CodeMirror(document.getElementById('editor-wrap'), {
        value:            _startValue,
        mode:             'foxdot',
        lineNumbers:      true,
        tabSize:          2,
        indentWithTabs:   false,
        lineWrapping:     false,
        autofocus:        true,
        matchBrackets:    true,
        autoCloseBrackets:true,
        styleActiveLine:  true,
        extraKeys: {
            'Ctrl-Enter':     () => runSelected(),
            'Cmd-Enter':      () => runSelected(),
            'Ctrl-Space':     (cm) => triggerAutocomplete(cm),
            'Alt-I':          (cm) => inspect(cm),
            'Alt-Up':         (cm) => incrementValue(cm,  1,  runBlockAtCursor),
            'Alt-Down':       (cm) => incrementValue(cm, -1,  runBlockAtCursor),
            'Shift-Alt-Up':   (cm) => incrementValue(cm,  10, runBlockAtCursor),
            'Shift-Alt-Down': (cm) => incrementValue(cm, -10, runBlockAtCursor),
            'Alt-X':          (cm) => stopPlayerAtCursor(cm, clock, runBlockAtCursor),
            'Alt-S':          (cm) => soloPlayerAtCursor(cm, clock),
            'Ctrl-Alt-S':     ()   => _unsoloFn(clock),
            'Alt-O':          (cm) => soloDropAtCursor(cm, clock, 8),
            'Ctrl-;':         ()   => clock.clear(),
            'Ctrl-Alt-;':     ()   => { cancelSection(); log('autoplay stopped — players keep running', 'warn'); },
            'Ctrl-Alt-P':     ()   => { if (!jumpToActive()) log('no active part', 'info'); },
            'Ctrl-/':         (cm) => cm.execCommand('toggleComment'),
        },
    });

    // Solo-mode autosave — debounced write of the buffer to localStorage
    if (!_sessionSlug) {
        let _saveTimer = null;
        editor.on('change', () => {
            clearTimeout(_saveTimer);
            _saveTimer = setTimeout(() => {
                try { localStorage.setItem(SOLO_KEY, editor.getValue()); } catch (_) {}
            }, 400);
        });
    }

    // ── UI wiring ─────────────────────────────────────────────────────────────
    document.getElementById('btn-boot').onclick  = bootAudio;
    document.getElementById('btn-run').onclick   = runSelected;
    document.getElementById('btn-stop').onclick  = () => clock.clear();
    document.getElementById('bpm-input').oninput = (e) => { clock.bpm = Number(e.target.value); };

    // Replace the whole buffer as one undoable edit (Ctrl+Z restores).
    function setEditorContent(text) {
        const last = editor.lastLine();
        editor.replaceRange(text, { line: 0, ch: 0 }, { line: last, ch: editor.getLine(last).length });
        editor.setCursor({ line: 0, ch: 0 });
        editor.focus();
    }
    document.getElementById('btn-rec').onclick      = toggleRec;
    document.getElementById('btn-examples').onclick = () => setEditorContent(examplesAsCode());
    document.getElementById('btn-clear').onclick    = () => setEditorContent('');

    // ── Crashpanel ────────────────────────────────────────────────────────────
    initCrashPanel(clock);

    // ── Docs ──────────────────────────────────────────────────────────────────
    initDocs();
    document.getElementById('docs-toggle-btn').onclick = toggleDocs;
    document.addEventListener('keydown', e => { if (e.key === 'F1') { e.preventDefault(); toggleDocs(); } });

    // Version label → derived from docs VERSION; click opens the changelog
    const vtag = document.getElementById('version-tag');
    vtag.textContent = 'α' + VERSION.replace(/[^0-9]/g, '');   // "alpha07" → "α07"
    vtag.title = VERSION + ' — changelog';
    vtag.onclick = () => openDocs('changelog');

    // ── Inspector (Alt+I) — give it a way to evaluate a pattern expression ────
    function evalSnippet(expr) {
        let js = expr
            .replace(/\bP\s*\*\s*\[([^\]]*)\]/g, 'PRand([$1])')
            .replace(/\bP\s*\[([^\]]*)\]/g, '[$1]');
        js = applyRenames(js);
        const ctx = buildCtx();
        return new Function(...Object.keys(ctx), 'return (' + js + ')')(...Object.values(ctx));
    }
    initInspect(evalSnippet);

    // ── Section sequencer ─────────────────────────────────────────────────────
    // Side-panel parts list — click a part to jump there; active part highlighted.
    function renderParts() {
        const el = document.getElementById('cp-parts');
        if (!el) return;
        el.innerHTML = '';
        const secs = getSections();
        if (secs.length === 0) {
            el.innerHTML = '<div style="font-size:10px;color:var(--text-2)">no #@ parts</div>';
        }
        for (const s of secs) {
            const d = document.createElement('div');
            if (s.track !== undefined) {
                d.className = 'cp-part track';
                d.textContent = '▸ ' + (s.track || 'track');
            } else {
                d.className = 'cp-part' + (s.active ? ' active' : '');
                const beats = s.beats != null ? `<span class="cp-part-beats">${s.beats}b</span>` : '';
                d.innerHTML = `${s.name}${beats}`;
                d.onclick = () => {
                    editor.setCursor({ line: s.line, ch: 0 });
                    editor.scrollIntoView({ line: s.line, ch: 0 }, 120);
                    editor.focus();
                };
            }
            el.appendChild(d);
        }
        const ap = document.getElementById('cp-autoplay');
        if (ap) {
            const on = isAutoplaying();
            ap.textContent = 'autoplay: ' + (on ? 'on' : 'off');
            ap.className = on ? 'on' : '';
        }
    }
    initSections(clock, runCode, editor, renderParts);
    renderParts();
    let _partsTimer = null;
    editor.on('change', () => { clearTimeout(_partsTimer); _partsTimer = setTimeout(renderParts, 300); });

    // ── Multiplayer — init if ?session= is in the URL ─────────────────────────
    if (_sessionSlug) {
        log(`Joining session: ${_sessionSlug}`, 'info');
        initCollab(_sessionSlug, clock, editor, (msg) => {
            // Peer eval received — flash lines and run without re-broadcasting
            if (msg.lines?.length === 2) flashLines(msg.lines[0], msg.lines[1]);
            log(`[${msg.author}] ${msg.code.split('\n')[0].slice(0, 60)}`, 'eval');
            runCode(msg.code, { fromRemote: true });
        }).then(collab => {
            _collab = collab;
            log(`Session ready. Share: ${location.href}`, 'ok');
        }).catch(err => {
            log(`Collab failed: ${err.message}`, 'error');
        });
    }

    log('WebFoxDot loaded. Click "boot" to start audio.', 'info');
  </script>
</body>
</html>
