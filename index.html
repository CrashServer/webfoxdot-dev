<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>crashDot</title>
  <link rel="icon" href="data:,">  <!-- suppress favicon.ico 404 -->
  <link rel="stylesheet" href="lib/codemirror/codemirror.min.css">
  <link rel="stylesheet" href="lib/codemirror/show-hint.css">
  <link rel="stylesheet" href="lib/codemirror/foldgutter.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Apply the saved/default theme before first paint (default: cyberpunk) -->
  <script>try{var t=localStorage.getItem('theme')||'cyberpunk';document.documentElement.className=(t==='dark')?'':t;}catch(e){document.documentElement.className='cyberpunk';}</script>
</head>
<body>
  <!-- ── Left: editor column ───────────────────────────────────────────── -->
  <div id="editor-container">

    <div id="toolbar">
      <span id="status-dot"></span>
      <span class="title">crashDot</span>
      <span id="version-tag" class="version-tag" title="changelog">α23</span>
      <button id="btn-boot">boot</button>
      <button id="btn-run"  disabled>run  Ctrl+↵</button>
      <button id="btn-stop" disabled>stop all</button>
      <button id="btn-reload" title="soft reload — stop everything &amp; free stuck audio nodes without a page refresh">↻ reset</button>
      <span id="synth-status"></span>
      <span id="load-meter" title="scheduler load / latency — the note clock runs on the main thread, so high lag = late notes. green=smooth, red=struggling">load —</span>
      <div style="flex:1"></div>
      <select id="examples-select" title="load an example into the editor">
        <option value="" disabled selected>examples ▾</option>
      </select>
      <button id="btn-clear" title="empty the editor">clear</button>
      <button id="docs-toggle-btn" title="documentation (F1)">?</button>
      <button id="btn-split" title="split view — peers' evals below (in a session)">⬓</button>
      <button id="btn-zen" title="hide all UI — clean editor (Shift+Alt+Z to restore)">⛶</button>
      <button id="btn-visuals" title="pop out the audio + code reactive visuals window">▦</button>
    </div>

    <!-- ── Docs overlay (inside editor-container for absolute positioning) ── -->
    <div id="docs-panel" class="hidden">
      <div id="docs-header">
        <button class="docs-tab active" data-tab="examples">Examples</button>
        <button class="docs-tab" data-tab="workflow">Workflow</button>
        <button class="docs-tab" data-tab="shortcuts">Shortcuts</button>
        <button class="docs-tab" data-tab="synths">Synths</button>
        <button class="docs-tab" data-tab="fx">FX</button>
        <button class="docs-tab" data-tab="patterns">Patterns</button>
        <button class="docs-tab" data-tab="functions">Functions</button>
        <button class="docs-tab" data-tab="guide">Guide</button>
        <button class="docs-tab" data-tab="changelog">Changelog</button>
        <button id="docs-close">✕</button>
      </div>
      <div id="docs-body"></div>
    </div>

    <div id="editor-wrap"></div>

    <!-- Split view: peers' evals stream below the shared editor (session only) -->
    <div id="peer-handle" class="hidden"></div>
    <div id="peer-feed" class="hidden"></div>

    <div id="log-handle"></div>
    <div id="log"></div>

  </div>

  <!-- ── Right: crashpanel ─────────────────────────────────────────────── -->
  <div id="crash-panel">
    <div id="cp-resize" title="drag to resize the panel"></div>
    <div id="cp-header">
      <div class="cp-title">crashDot</div>
      <div class="cp-subtitle">scsynth ▸ WASM</div>
    </div>

    <div class="cp-section">
      <h3>Clock</h3>
      <div id="cp-beat">—</div>
      <div id="cp-beat-sub" style="text-align:center;font-size:9px;color:var(--text-2);margin-bottom:2px;">◦◦◦◦</div>
      <!-- Phrase counters: current bar position within 4/8/16/32/64-bar phrases.
           Integer per-bar jumps (1,2,3,4…), webTroop-style — not a sliding fill. -->
      <div id="cp-phrases">
        <div class="cp-phrase" id="phrase-4">1/4</div>
        <div class="cp-phrase" id="phrase-8">1/8</div>
        <div class="cp-phrase" id="phrase-16">1/16</div>
        <div class="cp-phrase" id="phrase-32">1/32</div>
        <div class="cp-phrase" id="phrase-64">1/64</div>
      </div>
      <div class="cp-row">
        <span class="cp-label">BPM</span>
        <input id="bpm-input" type="number" value="120" min="20" max="300">
      </div>
      <button id="cp-tap">tap tempo</button>
    </div>

    <div class="cp-section">
      <h3>Scale</h3>
      <select class="cp-select" id="cp-scale-sel"></select>
      <h3 style="margin-top:6px">Root</h3>
      <select class="cp-select" id="cp-root-sel"></select>
    </div>

    <div class="cp-section" id="cp-midi">
      <div class="cp-row" style="padding:0">
        <h3 style="margin:0">MIDI</h3>
        <button id="cp-midi-enable" class="cp-btn" style="width:auto;padding:1px 8px">enable</button>
      </div>
      <div id="cp-midi-status">off</div>
      <div id="cp-midi-learn" class="midi-hint" style="display:none">⟳ learning — touch a control…</div>
      <div id="cp-midi-monitor"></div>
      <div id="cp-midi-bindings"></div>
      <button id="cp-midi-clear" class="cp-btn" style="display:none">clear bindings</button>
      <div id="cp-midi-out" class="cp-row" style="padding:2px 0;display:none">
        <span class="midi-hint" style="padding:0">out →</span>
        <select id="cp-midi-out-sel" class="cp-select" style="flex:1;width:auto;margin-top:0"></select>
      </div>
    </div>

    <div class="cp-section" id="cp-link">
      <div class="cp-row" style="padding:0">
        <h3 style="margin:0">Ableton Link</h3>
        <button id="cp-link-toggle" class="cp-btn" style="width:auto;padding:1px 8px">connect</button>
      </div>
      <div id="cp-link-status"><span class="link-off">off</span></div>
    </div>

    <div class="cp-section" id="cp-session">
      <h3>Session</h3>
      <div id="user-box" title="your name &amp; colour — shown to others in this session">
        <input type="color" id="user-color" title="your cursor colour">
        <input type="text" id="user-name" maxlength="24" placeholder="your name" spellcheck="false">
      </div>
      <div id="cp-peers"></div>
      <div id="cp-chat-log"></div>
      <input id="cp-chat-input" type="text" placeholder="chat…  (Enter)" maxlength="280" spellcheck="false">
    </div>

    <div class="cp-section">
      <h3>Composition</h3>
      <div id="cp-autoplay">autoplay: off</div>
      <button id="cp-stop-autoplay" class="cp-btn">■ stop autoplay</button>
      <div id="cp-parts"></div>
    </div>

    <div class="cp-section">
      <h3>Players</h3>
      <div id="cp-players"></div>
    </div>

    <div class="cp-section" id="cp-settings">
      <h3>Settings</h3>
      <select class="cp-select" id="theme-select">
        <option value="dark">Dark</option>
        <option value="cyberpunk">Cyberpunk</option>
        <option value="synthwave">Synthwave</option>
        <option value="terminal">Terminal</option>
      </select>
      <div class="cp-row" style="gap:4px;margin-top:4px">
        <button id="btn-rec" class="cp-btn" title="record your evals into a #@ composition">rec code</button>
        <button id="btn-rec-audio" class="cp-btn" title="record the audio output to a file">rec audio</button>
      </div>
    </div>
  </div>

  <!-- ── Scripts — load order matters ─────────────────────────────────── -->
  <script src="lib/codemirror/codemirror.min.js"></script>
  <script src="lib/codemirror/python.min.js"></script>
  <script src="lib/codemirror/overlay.js"></script>
  <script src="lib/codemirror/show-hint.js"></script>
  <script src="lib/codemirror/matchbrackets.js"></script>
  <script src="lib/codemirror/closebrackets.js"></script>
  <script src="lib/codemirror/active-line.js"></script>
  <script src="lib/codemirror/comment.js"></script>
  <script src="lib/codemirror/foldcode.js"></script>
  <script src="lib/codemirror/foldgutter.js"></script>
  <script src="js/editor/foxdot_mode.js"></script>

  <script type="module">
    import { SuperSonic }     from './lib/dist/supersonic.js';
    import { Clock }          from './js/engine/clock.js';
    import { Player, setSuperSonic, setWarn, setStepListener as _setStepListener, PLAYER_GROUP, FX_GROUP,
             drop as _dropFn, unsolo as _unsoloFn, soloRnd as _soloRndFn, panic as _panicFn, busStats as _busStats } from './js/engine/player.js';
    import { Scale, Root }    from './js/engine/scale.js';
    import { FX_SYNTHDEFS }   from './js/fx/registry.js';
    import { SYNTH_DEFS, makeSynth } from './js/synths/registry.js';
    import { PRand, PWhite, PWalk, PDur, PPing,
             PStutter, PAlt, PShuf, PBern, PCoin,
             PEuclid, PEuclid2, PRange, PStep, PSine, PTri,
             PChain, PMarkov, _group, _alt, Pmath, Pslice, melody,
             Pacc, PSwing, PBin, PFDur, PLife, PFr, PGauss, PArp, PStretch, PZip, PReverse, PMorse,
             PDrum, PwRand, PxRand, PLog, PTime, PSum, PDelta, PIndex, PSquare, PFib, PBeat, PJoin, PDelay,
             P10, PSaw, PSq, PZero, PBool, PFibMod, PPairs, PChar, PQuicken, PStrum, PZip2, PZ12 } from './js/patterns/sequences.js';
    import { _var, _linvar, _sinvar, _expvar, lininf, expinf, _fperlin, _fi, _fo, _fb, setClockRef } from './js/patterns/timevars.js';
    import { loadSamples, PlayStringCall, LoopCall, loadedSampleChars,
             loadSampleFromURL, loadPackFromURL } from './js/engine/sampler.js';
    import { chaosLines } from './js/engine/generator.js';
    import { pbuild, pkit, genres } from './js/engine/drumpatterns.js';
    import { transpile, applyRenames }   from './js/editor/transpiler.js';
    import { triggerAutocomplete }       from './js/editor/autocomplete.js';
    import { inspect, initInspect }      from './js/editor/inspect.js';
    import { incrementValue, stopPlayerAtCursor,
             soloPlayerAtCursor, soloDropAtCursor } from './js/editor/keybindings.js';
    import { initCrashPanel }            from './js/ui/crashpanel.js';
    import { initMidiPanel }             from './js/ui/midipanel.js';
    import { enableMidi, makeMidi }      from './js/midi/midi.js';
    import { enableMidiOut, makeMidiOut } from './js/midi/midiout.js';
    import { initLinkPanel }             from './js/ui/linkpanel.js';
    import { initLink, enableLink, disableLink } from './js/sync/link.js';
    import { openVisuals, startVisualsAudio, postCode, postStep, postInstant } from './js/visuals/bridge.js';
    import { initDocs, toggleDocs, openDocs, VERSION, examplesAsCode, exampleList, exampleCode } from './js/ui/docs.js';
    import { initSections, runSection, cancelSection,
             getSections, jumpToActive, isAutoplaying, applyRemoteSection, getActiveInfo } from './js/engine/sections.js';
    import { initCollab }                from './js/collab/collab.js';
    import { initSoloPresence }          from './js/collab/presence.js';
    import * as UGENS                    from './js/scsynth/ugens.js';
    import { defsynth, initDefsynth, userSynths } from './js/scsynth/defsynth.js';

    // ── Log ──────────────────────────────────────────────────────────────────
    const logEl = document.getElementById('log');
    function log(msg, type = 'info') {
        const d = document.createElement('div');
        d.className = 'log-' + type;
        d.textContent = `[${new Date().toLocaleTimeString('fr-FR')}] ${msg}`;
        logEl.appendChild(d);
        logEl.scrollTop = logEl.scrollHeight;
    }
    // Returns an updater fn that edits the same log line in place.
    function logLive(msg, type = 'info') {
        const d = document.createElement('div');
        d.className = 'log-' + type;
        d.textContent = `[${new Date().toLocaleTimeString('fr-FR')}] ${msg}`;
        logEl.appendChild(d);
        logEl.scrollTop = logEl.scrollHeight;
        return (newMsg, newType) => {
            if (newType) d.className = 'log-' + newType;
            d.textContent = `[${new Date().toLocaleTimeString('fr-FR')}] ${newMsg}`;
            logEl.scrollTop = logEl.scrollHeight;
        };
    }

    // ── Clock + TimeVar ───────────────────────────────────────────────────────
    const clock = new Clock();
    clock._onBpm = (bpm) => {
        const inp = document.getElementById('bpm-input');
        if (inp && Number(inp.value) !== bpm) inp.value = bpm;
        log(`Clock.bpm = ${bpm}`, 'ok');
    };
    setClockRef(clock);
    setWarn((msg) => log(msg, 'warn'));

    // ── Eval context ──────────────────────────────────────────────────────────
    const SYNTHS = Object.fromEntries(Object.keys(SYNTH_DEFS).map(n => [n, makeSynth(n)]));
    SYNTHS.piano = SYNTHS.basic;   // alias: "piano" was renamed to "basic"; keep old code working

    const ScaleProxy = new Proxy(Scale, {
        set(t, k, v) { t[k] = v; if (k === 'default') log(`Scale.default = ${JSON.stringify(v)}`, 'ok'); return true; }
    });
    const RootProxy = new Proxy(Root, {
        set(t, k, v) { t[k] = v; if (k === 'default') log(`Root.default = ${v}`, 'ok'); return true; }
    });

    function __p(name) { return clock.getPlayer(name, Player); }

    // Collab API — populated after initCollab() if ?session= is in the URL
    let _collab = null;
    let _remoteEval = false; // prevent re-broadcast of received evals
    let _applyingRemote = false; // while replaying a peer action, suppress re-broadcast

    // Broadcast a non-eval action (solo / composition state) to peers, if in a session.
    function broadcastAction(action, data = {}) {
        if (_collab && !_applyingRemote) _collab.broadcastAction(action, data);
    }

    // Replay an action received from a peer. Guarded so any UI hooks it triggers
    // (e.g. the section-active notifier) don't echo the action back out.
    function applyAction(msg) {
        _applyingRemote = true;
        try {
            switch (msg.action) {
                case 'solo':     clock._players.get(msg.name)?.solo();             break;
                case 'unsolo':   _unsoloFn(clock);                                 break;
                case 'soloDrop': clock._players.get(msg.name)?.soloDrop(msg.beats); break;
                case 'section':  applyRemoteSection(msg.line, msg.autoplay);       break;
                case 'cancel':   cancelSection();                                  break;
            }
        } finally { _applyingRemote = false; }
    }

    // Stop the auto-composition advance everywhere (players keep running).
    function stopAutoplay() {
        cancelSection();
        broadcastAction('cancel');
        log('autoplay stopped — players keep running', 'warn');
    }

    // Stop all: cancel the autoplay sequence FIRST (so a pending scheduled section
    // advance can't restart playback) then stop every player.
    function stopAll() {
        cancelSection();
        clock.clear();
    }

    // Soft reload — recover from a stuck engine without a page refresh.
    function softReload() {
        try {
            cancelSection();
            _panicFn(clock);
            log('soft reload: players stopped & audio nodes freed — re-run your code', 'ok');
        } catch (e) { log('soft reload failed: ' + e.message + ' (try a page refresh)', 'error'); }
    }

    // ── Master / global FX bus — n_set the master limiter node (Server.addFx /
    // Master().attr = …). Values are static snapshots (patterns resolve to now).
    let _scRef = null;
    const MASTER_PARAMS = {
        gain: 'gain', ceiling: 'ceiling', lpf: 'lpf', lpf_rq: 'lpf_rq', hpf: 'hpf', hpf_rq: 'hpf_rq',
        mverb: 'mverb', echo: 'echo', echo_time: 'echo_time', echo_dec: 'echo_dec',
        tanh: 'tanh', drive: 'tanh_drive', lofi: 'lofi',
    };
    function masterSet(opts) {
        const params = [];
        for (const [k, v] of Object.entries(opts || {})) {
            const sp = MASTER_PARAMS[k];
            if (!sp) continue;
            const val = (v && typeof v.get === 'function') ? v.get(0) : v;   // snapshot patterns/timevars
            params.push(sp, Number(val));
        }
        if (params.length && _scRef) _scRef.send('/n_set', MASTER_NODE, ...params);
    }
    function masterClear() {
        masterSet({ gain: 1, lpf: 0, hpf: 0, mverb: 0, echo: 0, tanh: 0, lofi: 0 });
        log('master FX cleared', 'info');
    }

    // The eval context is ~130 globals. Everything except live-defined synths is
    // static (closures capture stable refs: clock, log, masters), so build it ONCE
    // and only merge the growing userSynths per eval.
    let _ctxStatic = null;
    function buildCtx() {
        if (!_ctxStatic) _ctxStatic = {
            Clock: new Proxy(clock, {
                set(t, k, v) { if (k === 'bpm') t.bpm = v; else t[k] = v; return true; }
            }),
            Scale: ScaleProxy,
            Root:  RootProxy,
            __stopAll: () => { clock._players.forEach(p => p.stop()); },
            cancelSection,
            __p,
            ...SYNTHS,
            PRand, PWhite, PWalk, PDur, PPing,
            PStutter, PAlt, PShuf, PBern, PCoin,
            PEuclid, PEuclid2, PRange, PStep, PSine, PTri,
            PChain, PMarkov, Pacc, PSwing, PBin, PFDur, PLife, PFr, PGauss, PArp, PStretch, PZip, PReverse, PMorse,
            PDrum, PwRand, PxRand, PLog, PTime, PSum, PDelta, PIndex, PSquare, PFib, PBeat, PJoin, PDelay,
            P10, PSaw, PSq, PZero, PBool, PFibMod, PPairs, PChar, PQuicken, PStrum, PZip2, PZ12,
            Pmath, Pslice, melody,
            _var, _linvar, _sinvar, _expvar, lininf, expinf,
            fperlin: _fperlin,
            fi: _fi, fo: _fo, fb: _fb,
            __group: _group,
            _alt,
            ...UGENS,            // SinOsc, Saw, RLPF, Out, EnvGen, Env, Pan2, …
            defsynth,
            rest:   () => null,
            play:   (pattern, opts = {}) => new PlayStringCall(pattern, opts),
            // loop(name, dur=1, …) — beat-synced audio-loop player. Register named
            // loops with loadloop(name, url) first. dur sets the bars to stretch to.
            loop:   (name, opts = {}) => new LoopCall(name, opts),
            loadloop: (name, url) => loadSampleFromURL(name, url)
                .then(ok => log(ok ? `loop "${name}" loaded` : `loop "${name}": all URLs failed`, ok ? 'ok' : 'error'))
                .catch(e => log(`loadloop "${name}": ${e.message}`, 'error')),
            loadsample: (char, url) => loadSampleFromURL(char, url)
                .then(ok => log(ok ? `sample "${char}" loaded` : `sample "${char}": all URLs failed`, ok ? 'ok' : 'error'))
                .catch(e => log(`loadsample "${char}": ${e.message}`, 'error')),
            loadpack: (url) => {
                const update = logLive('loadpack: fetching…');
                return loadPackFromURL(url, (done, total) => {
                    update(`loadpack: ${done}/${total} samples…`);
                })
                .then(n => update(n ? `loadpack: ${n} chars loaded ✓` : 'loadpack: 0 chars loaded (all failed)', n ? 'ok' : 'error'))
                .catch(e => update(`loadpack: ${e.message}`, 'error'));
            },
            print:  (...a) => log(a.join(' ')),
            drop:   (playTime = 14, dropTime = 2, nbloop = 1) => _dropFn(clock, playTime, dropTime, nbloop, (m) => log(m, 'info')),
            // chaos(n=4, type) — generate n random players (synth/drum/mix) into
            // g1,g2,… (kept separate from your p1/b1) and PASTE them into the editor
            // as a fresh block. It does NOT run them — review/edit, then evaluate.
            // type: "synth" | "drum".
            chaos:  (n = 4, type = null) => {
                const taken = new Set([...clock._players.keys()].filter(k => clock._players.get(k)._active));
                const lines = chaosLines(n, type, { sampleChars: loadedSampleChars(), taken });
                const last  = editor.lastLine();
                const atEnd = editor.getValue().trim() === '';
                const pre   = atEnd ? '' : '\n\n';
                const startLine = atEnd ? 0 : last + 2;   // first pasted line
                editor.replaceRange(pre + lines.join('\n') + '\n',
                    { line: last, ch: editor.getLine(last).length });
                editor.setCursor({ line: startLine, ch: 0 });
                editor.scrollIntoView({ line: startLine, ch: 0 });
                editor.focus();
                log(`chaos: pasted ${lines.length} lines — review, then run (Ctrl+Alt+↵)`, 'info');
            },
            // Genre drum-pattern generator → play() strings.
            //   b1 >> play(pbuild("techno"), dur=0.25)
            //   b1 >> play(pbuild("house", evolve=8, fill=4, density=0.8), dur=0.25)
            pbuild, pkit, genres,
            softReload: () => softReload(),
            Server: { addFx: (opts = {}) => masterSet(opts), clearFx: () => masterClear() },
            Master: () => new Proxy({}, { set(_t, k, v) { masterSet({ [String(k)]: v }); return true; }, get() { return undefined; } }),
            unsolo: () => _unsoloFn(clock),
            soloRnd: (time = 8) => _soloRndFn(clock, time, (m) => log(m, 'info')),
            // MIDI control: midi(cc,lo,hi[,curve]) binds a CC knob to a live value;
            // mlearn(lo,hi[,curve]) binds the next control you touch. Use inline or
            // via assignment: p1.lpf = midi(74, 100, 8000, 'exp')
            midi:   (cc, lo = 0, hi = 1, curve = 'lin') => { _ensureMidi(); return makeMidi(cc, lo, hi, curve); },
            mlearn: (lo = 0, hi = 1, curve = 'lin')      => { _ensureMidi(); return makeMidi(null, lo, hi, curve); },
            // MIDI out: m1 >> midiout([0,2,4], channel=1, oct=5) sends notes to an
            // external/virtual MIDI port (velocity from amp, length from sus/leg).
            midiout: (deg, opts = {}) => { _ensureMidiOut(); return _midiout(deg, opts); },
            // Ableton Link — follow Ableton's tempo + bar phase. link()/link(true)
            // connects to the bridge (server/link-bridge.js); link(false) disconnects.
            link:   (on = true) => { if (on) enableLink(); else disableLink(); log(`Link ${on ? 'connecting…' : 'off'}`, 'info'); },
        };
        // userSynths (defsynth) grows at runtime — merge it fresh each eval.
        return { ..._ctxStatic, ...userSynths };
    }

    // Lazy Web MIDI enable — first midi()/mlearn() call (an eval keypress is a
    // valid user gesture for the permission prompt). Logs once.
    let _midiAsked = false;
    function _ensureMidi() {
        if (_midiAsked) return;
        _midiAsked = true;
        enableMidi()
            .then(() => log('MIDI enabled — twist a control', 'ok'))
            .catch(e => log(`MIDI: ${e.message}`, 'error'));
    }

    // Lazy Web MIDI output enable — first midiout() call. Shares the access above.
    const _midiout = makeMidiOut();
    let _midiOutAsked = false;
    function _ensureMidiOut() {
        if (_midiOutAsked) return;
        _midiOutAsked = true;
        enableMidiOut()
            .then(() => log('MIDI out enabled — pick a port in the MIDI panel', 'ok'))
            .catch(e => log(`MIDI out: ${e.message}`, 'error'));
    }

    // Compiled-function cache: re-running the same block (the common live-coding
    // loop) reuses the compiled fn instead of re-parsing ~130 named params each
    // time. Keyed by transpiled source + ctx key-count (a new defsynth appends a
    // key → count changes → recompile; same block, no new synth → cache hit).
    const _fnCache = new Map();
    function runCode(raw, { fromRemote = false, author = '', color = '' } = {}) {
        let js = transpile(raw.trim());
        js = applyRenames(js);
        log(`eval: ${raw.trim().split('\n')[0].slice(0, 70)}`, 'eval');
        const ctx  = buildCtx();
        const keys = Object.keys(ctx);
        try {
            let entry = _fnCache.get(js);
            if (!entry || entry.n !== keys.length) {
                if (_fnCache.size > 200) _fnCache.clear();
                entry = { fn: new Function(...keys, js), n: keys.length };
                _fnCache.set(js, entry);
            }
            entry.fn(...Object.values(ctx));
            // code reactivity → visuals window (tagged with the author: self or peer)
            { const u = getUser(); postCode(raw.trim(), author || u.name, color || u.color); }
        } catch (e) {
            log(`Error: ${e.message}`, 'error');
            console.error('transpiled:\n' + js, e);
        }
        // Broadcast to peers (skip if this eval came from a peer)
        if (!fromRemote && _collab) {
            const user = getUser();
            _collab.broadcastEval(raw, [], user.name, user.color, clock.now());
        }
    }

    // ── Block runner ──────────────────────────────────────────────────────────
    function runBlockAtCursor() {
        const cursor = editor.getCursor();
        // #@ section headers — intercept before normal block logic
        const cursorLine = editor.getLine(cursor.line).trim();
        if (cursorLine.startsWith('#@#@')) return; // track header — fold only
        if (cursorLine.startsWith('#@')) {
            flashLines(cursor.line, cursor.line);
            runSection(cursor.line);
            return;
        }
        let s = cursor.line, e = cursor.line;
        const n = editor.lineCount();
        while (s > 0 && editor.getLine(s - 1).trim()) s--;
        while (e < n - 1 && editor.getLine(e + 1).trim()) e++;
        const block = editor.getRange({ line: s, ch: 0 }, { line: e, ch: editor.getLine(e).length }).trim();
        if (block) {
            flashLines(s, e);
            recordSourceLines(s, e);
            runCode(block);
            recCapture(block);
        }
    }

    function runSelected() {
        const sel = editor.getSelection().trim();
        if (sel) {
            const from = editor.getCursor('from');
            const to   = editor.getCursor('to');
            flashLines(from.line, to.line);
            recordSourceLines(from.line, to.line);
            runCode(sel);
            recCapture(sel);
        } else {
            runBlockAtCursor();
        }
    }

    // Ctrl+Enter — evaluate just the current line (or the selection, if any).
    function runLineAtCursor() {
        if (editor.getSelection().trim()) return runSelected();
        const cursor   = editor.getCursor();
        const lineText = editor.getLine(cursor.line);
        const trimmed  = lineText.trim();
        if (!trimmed) return;
        if (trimmed.startsWith('#@#@')) return;        // track header — fold only
        if (trimmed.startsWith('#@')) {                // section header — run section
            flashLines(cursor.line, cursor.line);
            runSection(cursor.line);
            return;
        }
        flashLines(cursor.line, cursor.line);
        recordSourceLines(cursor.line, cursor.line);
        runCode(lineText);
        recCapture(lineText);
    }

    // ── Composition recording ─────────────────────────────────────────────────
    // Capture each user eval with its beat offset; on stop, generate a #@ set.
    let _rec = { on: false, startBeat: 0, events: [] };
    function recCapture(code) {
        if (_rec.on) _rec.events.push({ beat: clock.now() - _rec.startBeat, code });
    }
    function buildComposition(events, bpm) {
        if (!events.length) return null;
        const GAP = 4;                                   // beats of silence → new section
        const names = ['intro', 'build', 'peak', 'break', 'drop', 'outro'];
        const snap = (d) => Math.max(4, Math.round(d / 4) * 4);
        const sections = [];
        let cur = { codes: [events[0].code], start: events[0].beat }, ci = 0;
        for (let i = 1; i < events.length; i++) {
            if (events[i].beat - events[i - 1].beat > GAP) {
                cur.dur  = snap(events[i].beat - cur.start);
                cur.name = ci < names.length ? names[ci] : 'part' + (ci + 1);
                sections.push(cur); ci++;
                cur = { codes: [], start: events[i].beat };
            }
            cur.codes.push(events[i].code);
        }
        cur.dur = 16; cur.name = ci < names.length ? names[ci] : 'part' + (ci + 1);
        sections.push(cur);
        let s = '#@#@ recorded\n\n';
        for (const sec of sections) s += `#@${sec.name}(${sec.dur})\n${sec.codes.join('\n')}\n\n`;
        return s + '#@end(16)\n';
    }
    // ── Audio recording — captures this tab's audio output to a file ──────────
    let _audioRec = { recorder: null, stream: null, chunks: [] };
    async function toggleRecAudio() {
        const btn = document.getElementById('btn-rec-audio');
        if (_audioRec.recorder) {                 // stop
            _audioRec.recorder.stop();
            return;
        }
        try {
            // getDisplayMedia is the only way to tap tab audio without engine access.
            // The share dialog needs "share tab audio" enabled.
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            const audio = stream.getAudioTracks();
            if (audio.length === 0) {
                stream.getTracks().forEach(t => t.stop());
                log('rec audio: no audio track — tick "share tab audio" in the dialog', 'error');
                return;
            }
            const rec = new MediaRecorder(new MediaStream(audio), { mimeType: 'audio/webm' });
            _audioRec = { recorder: rec, stream, chunks: [] };
            rec.ondataavailable = (e) => { if (e.data.size) _audioRec.chunks.push(e.data); };
            rec.onstop = () => {
                const blob = new Blob(_audioRec.chunks, { type: 'audio/webm' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'webfoxdot-' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.webm';
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
                _audioRec.stream.getTracks().forEach(t => t.stop());
                _audioRec = { recorder: null, stream: null, chunks: [] };
                btn.classList.remove('recording'); btn.textContent = 'rec audio';
                log('audio recording saved (.webm)', 'ok');
            };
            // If the user stops sharing from the browser bar, finalise too.
            stream.getVideoTracks().forEach(t => t.addEventListener('ended', () => { if (_audioRec.recorder) rec.stop(); }));
            rec.start();
            btn.classList.add('recording'); btn.textContent = '● audio';
            log('recording audio output…', 'warn');
        } catch (e) {
            log('rec audio cancelled: ' + e.message, 'warn');
        }
    }

    function toggleRec() {
        const btn = document.getElementById('btn-rec');
        if (!_rec.on) {
            _rec = { on: true, startBeat: clock.now(), events: [] };
            btn.classList.add('recording'); btn.textContent = '● rec';
            log('recording composition — play your set, then press rec again', 'warn');
        } else {
            _rec.on = false;
            btn.classList.remove('recording'); btn.textContent = 'rec';
            const compo = buildComposition(_rec.events, clock.bpm);
            if (!compo) { log('recording empty — nothing captured', 'warn'); return; }
            const last = editor.lastLine();
            editor.replaceRange('\n\n# ══ recorded composition (run the #@ parts) ══\n' + compo,
                { line: last, ch: editor.getLine(last).length });
            log(`composition recorded — ${_rec.events.length} evals → appended to the buffer`, 'ok');
        }
    }

    async function bootAudio() {
        const dot = document.getElementById('status-dot');
        const btn = document.getElementById('btn-boot');
        dot.className = 'booting';
        btn.disabled = true;
        btn.textContent = 'booting…';
        log('Booting scsynth WASM…');
        try {
            // Match the AudioContext rate to the audio device. SuperSonic otherwise
            // forces 48 kHz; on Firefox, opening a 48 kHz context while another tab
            // (e.g. a playing YouTube tab) already holds the device at a different
            // rate — usually 44.1 kHz — hangs or crashes the browser. scsynth and our
            // synthdefs are sample-rate-agnostic, so matching the device rate is safe.
            let hwSampleRate = 0;
            try {
                const ProbeAC = window.AudioContext || window.webkitAudioContext;
                const probe = new ProbeAC();
                hwSampleRate = probe.sampleRate;
                await probe.close();
            } catch (_) {}
            if (hwSampleRate && hwSampleRate !== 48000) {
                log(`  matching audio device rate: ${hwSampleRate} Hz`, 'info');
            }

            const sc = new SuperSonic({
                baseURL:         './lib/dist/',
                synthdefBaseURL: './synthdefs/compiled/',
                // Use the device's native rate (see hwSampleRate probe above).
                ...(hwSampleRate ? { audioContextOptions: { sampleRate: hwSampleRate } } : {}),
                // Server limits — merged over SuperSonic's defaults as
                // {...defaults, ...scsynthOptions}. The default numAudioBusChannels
                // is only 128, and each player takes a private stereo bus at 64+2N,
                // so >~32 players ran out → writes wrapped onto the output bus and
                // everything went silent. Raise buses (and node/wire headroom).
                scsynthOptions: {
                    numAudioBusChannels: 2048,   // ~990 private stereo buses
                    maxNodes:            8192,
                    maxWireBufs:         256,    // headroom for the big FX-chain graph
                },
                // Firefox crashes on shared-memory WebAssembly.Memory.grow(), which
                // SuperSonic calls when the sample buffer pool needs to expand.
                // Set the pool's initial size == maximum so it's allocated once at
                // boot and never grows. 128MB holds a full pack + lazy built-ins.
                memory: {
                    bufferPoolSize:    128 * 1024 * 1024,
                    maxBufferPoolSize: 128 * 1024 * 1024,
                },
            });
            // Watchdog: if the audio engine doesn't start (Firefox can hang opening
            // the device when another tab is using it), surface an actionable error
            // instead of leaving the button stuck on "booting…".
            await Promise.race([
                sc.init(),
                new Promise((_, rej) => setTimeout(
                    () => rej(new Error('audio engine did not start in 25s — another tab may be using the audio device; close audio/video tabs (e.g. YouTube) and retry')),
                    25000)),
            ]);
            log('scsynth started ✓', 'ok');

            // Group 1 (DefaultGroup) is NOT auto-created in this WASM build — use group 0 (RootNode).
            // PLAYER_GROUP head of RootNode, FX_GROUP after PLAYER_GROUP.
            sc.send('/g_new', PLAYER_GROUP, 0, 0);
            sc.send('/g_new', FX_GROUP,     3, PLAYER_GROUP);
            log(`  groups created: playerGroup=${PLAYER_GROUP}, fxGroup=${FX_GROUP}`, 'ok');

            const synthStatus = document.getElementById('synth-status');
            for (const name of SYNTHDEFS_TO_LOAD) {
                synthStatus.textContent = `loading ${name}…`;
                try {
                    await sc.loadSynthDef(name);
                    log(`  ${name} ✓`, 'ok');
                } catch (e) {
                    log(`  ${name} FAILED: ${e.message}`, 'error');
                    console.error(`loadSynthDef ${name}:`, e);
                }
            }
            // Master safety limiter at the tail of RootNode — sees the summed mix
            // of every player + FX, so stacking loud players can't hard-clip.
            sc.send('/s_new', 'fd_master', MASTER_NODE, 1, 0);
            log('  master limiter ✓', 'ok');

            synthStatus.textContent = 'reading sample manifest…';
            try {
                const charCount = await loadSamples(sc);
                if (charCount > 0) {
                    log(`  sample bank ready ✓ (${charCount} chars, lazy-loaded on first use)`, 'ok');
                } else {
                    log('  no sample bank — run setup_samples.py to configure one', 'warn');
                }
            } catch (e) {
                log(`  sample manifest FAILED: ${e.message}`, 'error');
                console.error('loadSamples:', e);
            }
            synthStatus.textContent = '';

            setSuperSonic(sc);
            _scRef = sc;
            initDefsynth(sc, (name) => log(`synth "${name}" defined ✓`, 'ok'));
            // feed the pop-out visuals window (audio + beat + the active #@ section)
            startVisualsAudio(sc, clock, () => {
                try {
                    const info = getActiveInfo();
                    let section = '';
                    if (info && info.line >= 0) {
                        const m = (editor.getLine(info.line) || '').match(/#@\s*(\w+)/);
                        section = m ? m[1] : '';
                    }
                    return { section, autoplay: isAutoplaying() };
                } catch (_) { return {}; }
            });
            clock.start();

            dot.className = 'ready';
            btn.textContent = 'booted';
            btn.classList.add('booted');
            document.getElementById('btn-run').disabled  = false;
            document.getElementById('btn-stop').disabled = false;
            log('Ready. Clock running.', 'ok');
        } catch (e) {
            log(`Boot failed: ${e.message}`, 'error');
            console.error(e);
            document.getElementById('status-dot').className = '';
            btn.disabled = false;
            btn.textContent = 'retry boot';
        }
    }

            .replace(/\bP\s*\*\s*\[([^\]]*)\]/g, 'PRand([$1])')
            .replace(/\bP\s*\[([^\]]*)\]/g, '[$1]');

    // Fill the active part's progress squares as it advances through its beats.
    // Runs on a rAF loop while autoplaying; only touches the DOM when the count
    // changes, so it's cheap.
    let _lastFilled = -1, _progressRAF = null;
    function updateProgressSquares() {
        const info = getActiveInfo();
        const active = document.querySelector('#cp-parts .cp-part.active');
        if (!active || info.beats == null) { _lastFilled = -1; return; }
        const prog = active.querySelector('.cp-prog');
        if (!prog) return;
        const sqs = prog.children;
        const frac = Math.max(0, Math.min(1, (clock.now() - info.start) / info.beats));
        const filled = Math.min(sqs.length, Math.round(frac * sqs.length));
        if (filled === _lastFilled) return;
        _lastFilled = filled;
        for (let i = 0; i < sqs.length; i++) sqs[i].className = i < filled ? 'on' : '';
    }
    function progressLoop() {
        if (isAutoplaying()) updateProgressSquares();
        _progressRAF = requestAnimationFrame(progressLoop);
    }
    _progressRAF = requestAnimationFrame(progressLoop);
    initSections(clock, runCode, editor, renderParts, (line, autoplay) => {
        // Record the active section's player lines so the live highlight lands on
        // the section that's actually sounding.
        if (line >= 0) {
            let end = editor.lineCount();
            for (let i = line + 1; i < editor.lineCount(); i++) {
                if (editor.getLine(i).trim().startsWith('#@')) { end = i; break; }
            }
            recordSourceLines(line + 1, end - 1);
        }
        // Mirror the active section + autoplay state to peers (cosmetic; the
        // section code itself rides the eval broadcast).
        broadcastAction('section', { line, autoplay });
    });
    renderParts();
    let _partsTimer = null;
    editor.on('change', () => { clearTimeout(_partsTimer); _partsTimer = setTimeout(renderParts, 300); });

    // ── Live degree / sample highlight ────────────────────────────────────────
    // Mark the array element (synth) or play-char (drums) a player is sounding.
    // A name can appear on several lines (composition sections), so we resolve to
    // the occurrence inside the currently-active #@ section.
    const _degMarks = new Map();      // playerName → CodeMirror TextMarker
    const _spanCache = new Map();     // lineText → [[s,e],…] | null
    const _srcLine  = new Map();      // name → line that last (re)defined it
    const _NAME_RE = /^\s*~?\s*([a-zA-Z_]\w*)\s*>>/;

    // Remember which editor line evaluated each player, so the highlight lands on
    // the line that's actually sounding (a name can recur across sections).
    function recordSourceLines(from, to) {
        const lo = Math.max(0, from), hi = Math.min(editor.lineCount() - 1, to);
        for (let i = lo; i <= hi; i++) {
            const m = editor.getLine(i).match(_NAME_RE);
            if (m) _srcLine.set(m[1], i);
        }
    }
    function resolveLine(name) {
        const rec = _srcLine.get(name);
        if (rec != null && rec < editor.lineCount()) {
            const m = editor.getLine(rec).match(_NAME_RE);
            if (m && m[1] === name) return rec;   // still valid
        }
        return findPlayerLine(name);
    }

    function findPlayerLine(name) {
        const active = isAutoplaying() ? getActiveInfo().line : -1;
        let secEnd = editor.lineCount();
        if (active >= 0) {
            for (let i = active + 1; i < editor.lineCount(); i++) {
                if (editor.getLine(i).trim().startsWith('#@')) { secEnd = i; break; }
            }
        }
        let best = -1, fallback = -1;
        for (let i = 0; i < editor.lineCount(); i++) {
            const m = editor.getLine(i).match(_NAME_RE);
            if (m && m[1] === name) {
                fallback = i;
                if (active >= 0 && i >= active && i < secEnd) best = i;
            }
        }
        return best >= 0 ? best : fallback;
    }

    // Element spans of one [...] array opening at `open`; returns {spans,end}.
    function arraySpans(text, open) {
        let depth = 0, j = open;
        for (; j < text.length; j++) { const c = text[j]; if (c === '[') depth++; else if (c === ']') { depth--; if (depth === 0) break; } }
        if (j >= text.length) return null;
        const spans = []; let d = 0, start = open + 1;
        for (let k = open + 1; k <= j; k++) {
            const c = text[k];
            if (k === j || (c === ',' && d === 0)) {
                let s = start, e = k;
                while (s < e && /\s/.test(text[s])) s++;
                while (e > s && /\s/.test(text[e - 1])) e--;
                if (e > s) spans.push([s, e]);
                start = k + 1;
            } else if (c === '(' || c === '[' || c === '{' || c === '<') d++;
            else if (c === ')' || c === ']' || c === '}' || c === '>') d--;
        }
        return { spans, end: j };
    }
    // All stepped arrays on a line: the degree + every direct param=[...] (and for
    // play(), the chars of a flat string). Each is highlighted at step % its length.
    function parseArrays(lineText) {
        const ge = lineText.indexOf('>>');
        if (ge < 0) return null;
        const op = lineText.indexOf('(', ge);
        if (op < 0) return null;
        if (/^\s*~?\s*play\b/.test(lineText.slice(ge + 2))) {
            let i = op + 1; while (i < lineText.length && /\s/.test(lineText[i])) i++;
            let q = ''; if (lineText[i] === '"' || lineText[i] === "'") { q = lineText[i]; i++; }
            if (!q) return null;                        // only quoted play strings
            // One span per top-level token (char / . / space = one step; a bracket
            // group (..) [..] {..} <..> = one step spanning the whole group) so the
            // highlight stays aligned even with brackets.
            const spans = [];
            for (let k = i; k < lineText.length && lineText[k] !== q; k++) {
                const c = lineText[k];
                if ('([{<'.includes(c)) {
                    let depth = 0, j = k;
                    for (; j < lineText.length; j++) {
                        const d = lineText[j];
                        if ('([{<'.includes(d)) depth++;
                        else if (')]}>'.includes(d)) { depth--; if (depth === 0) break; }
                    }
                    spans.push([k, j + 1]); k = j;
                } else {
                    spans.push([k, k + 1]);             // char / . / space — one step each
                }
            }
            return spans.length ? [spans] : null;
        }
        // synth: capture every array that is a direct argument (paren depth 1)
        const out = [];
        let pdepth = 0;
        for (let k = op; k < lineText.length; k++) {
            const c = lineText[k];
            if (c === '(') pdepth++;
            else if (c === ')') { pdepth--; if (pdepth === 0) break; }
            else if (c === '[' && pdepth === 1) {
                const r = arraySpans(lineText, k);
                if (r && r.spans.length) { out.push(r.spans); k = r.end; }
            }
            else if ((c === '{' || c === '<') && pdepth === 1) {
                // {a,b,c} random / <a b c> alternation: the engine picks/cycles these,
                // so we can't pin the exact element — highlight the whole group as one
                // span (and skip its interior so a nested [..] isn't tracked instead).
                let depth = 0, j = k;
                for (; j < lineText.length; j++) {
                    const d = lineText[j];
                    if ('([{<'.includes(d)) depth++;
                    else if (')]}>'.includes(d)) { depth--; if (depth === 0) break; }
                }
                if (j < lineText.length) { out.push([[k, j + 1]]); k = j; }
            }
        }
        return out.length ? out : null;
    }
    function arraysFor(lineText) {
        if (_spanCache.has(lineText)) return _spanCache.get(lineText);
        const arrays = parseArrays(lineText);
        if (_spanCache.size > 300) _spanCache.clear();
        _spanCache.set(lineText, arrays);
        return arrays;
    }
    const _MARK_CSS = 'background:rgba(63,185,80,0.5);color:#fff;border-radius:2px';
    const _lastMark = new Map();   // name → last mark time, to cap DOM churn at fast durs
    const _markSig  = new Map();   // name → signature of the currently-marked spans
    function clearDegMark(name) {
        const ms = _degMarks.get(name);
        if (ms) { ms.forEach(m => { try { m.clear(); } catch (_) {} }); _degMarks.delete(name); }
        _markSig.delete(name);
    }
    function highlightStep(name, step) {
        if (step < 0) { clearDegMark(name); return; }
        // Throttle to ~25fps per player: at fast durs the markText DOM churn would
        // compete with the audio clock on the main thread.
        const now = performance.now();
        if (now - (_lastMark.get(name) || 0) < 40) return;
        _lastMark.set(name, now);
        const line = resolveLine(name);
        if (line < 0 || line >= editor.lineCount()) { clearDegMark(name); return; }
        const arrays = arraysFor(editor.getLine(line));
        if (!arrays) { clearDegMark(name); return; }
        // Pick this step's span per array + build a signature; if it matches what's
        // already marked, skip the clear+markText DOM churn entirely (common when a
        // degree array is length-1 or a slow pattern holds the same element).
        const picks = [];
        let sig = line + ':';
        for (const spans of arrays) {
            const [s, e] = spans[((step % spans.length) + spans.length) % spans.length];
            picks.push(s, e); sig += s + '-' + e + ',';
        }
        if (_markSig.get(name) === sig) return;
        clearDegMark(name);
        const marks = [];
        for (let i = 0; i < picks.length; i += 2) {
            marks.push(editor.markText({ line, ch: picks[i] }, { line, ch: picks[i + 1] }, { className: 'wfd-playing', css: _MARK_CSS }));
        }
        _degMarks.set(name, marks);
        _markSig.set(name, sig);
    }
    _setStepListener((name, step) => { highlightStep(name, step); postStep(name, step); });

    // ── User identity (multiplayer) — name + cursor colour ────────────────────
    function userRandomColor() { return `hsl(${Math.floor(Math.random() * 360)}, 70%, 60%)`; }
    function getUser() {
        let u = null;
        try { u = JSON.parse(localStorage.getItem('wfd-user') || 'null'); } catch (_) {}
        if (!u || !u.name) u = { name: 'user' + Math.floor(Math.random() * 99), color: userRandomColor() };
        // Stable id survives refreshes so peers don't double you up on reload.
        if (!u.id) u.id = 'u' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        localStorage.setItem('wfd-user', JSON.stringify(u));
        return u;
    }
    // <input type=color> needs #rrggbb — normalise any CSS colour (e.g. hsl()) via canvas.
    function toHexColor(color) {
        if (/^#[0-9a-f]{6}$/i.test(color)) return color;
        const ctx = document.createElement('canvas').getContext('2d');
        ctx.fillStyle = color || '#888888';
        return ctx.fillStyle;
    }
    // Reveal + wire the name/colour box (only shown in a session).
    function initUserBox() {
        const box   = document.getElementById('user-box');

        colI.value  = toHexColor(user.color);
        box.classList.add('active');
        const save = () => {
            const u = { ...getUser(), name: nameI.value.trim() || 'anon', color: colI.value };
            localStorage.setItem('wfd-user', JSON.stringify(u));
            if (_collab) _collab.setUser(u);   // live-update peers' cursors
        };
        nameI.onchange = save;
        nameI.onblur   = save;
        colI.oninput   = save;
    }

    // Render the connected-peers list (name + colour); marks you as "(you)".
    // Keyed by client id, so renaming updates your entry instead of duplicating.
    function renderPeers(peers) {
        const el = document.getElementById('cp-peers');
        if (!el) return;
        if (!peers || peers.length === 0) {
            el.innerHTML = '<div style="font-size:10px;color:var(--text-2)">connecting…</div>';
            return;
        }
        const seen = new Set();
        el.innerHTML = '';
        for (const u of peers) {
            if (!u || seen.has(u.id)) continue;
            seen.add(u.id);
            const d = document.createElement('div');
            d.className = 'cp-peer';
            d.innerHTML = `<span class="cp-peer-dot" style="background:${u.color || '#888'}"></span>` +
                `<span class="cp-peer-name">${u.name || 'anon'}${u.isSelf ? ' (you)' : ''}</span>`;
            el.appendChild(d);
        }
    }

    // ── Session chat ──────────────────────────────────────────────────────────
    function escapeHtml(s) {
        return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        log.appendChild(d);

    function sendChat() {

        setSplit(true);  // peers exist → show the split feed by default

    // ── Load / latency meter ──────────────────────────────────────────────────
    // The note scheduler runs on the main thread, so event-loop lag = late notes.
    // We measure how late a fixed-interval timer fires (event-loop delay) and show
    // it alongside the active voice count.
    (function loadMeter() {
        const el = document.getElementById('load-meter');
        if (!el) return;
        const PERIOD = 500;
        let last = performance.now();
        setInterval(() => {
            const now = performance.now();
            const lag = Math.max(0, now - last - PERIOD);
            last = now;
            const voices = clock._players ? [...clock._players.values()].filter(p => p._active).length : 0;
            const bus    = _busStats();                 // { used, peak } private stereo buses
            const BUS_MAX = (2048 - 64) / 2;             // numAudioBusChannels − base, /stereo
            el.textContent = `${lag.toFixed(0)}ms · ${voices}v · ${bus.used}/${BUS_MAX}bus`;
            // red on scheduler lag OR when buses are running low
            el.className = (lag > 30 || bus.used > BUS_MAX * 0.9) ? 'hi'
                         : (lag > 10 || bus.used > BUS_MAX * 0.7) ? 'mid' : 'ok';
            el.title = `scheduler lag ${lag.toFixed(0)}ms · ${voices} active players · ${bus.used} private buses in use (max ~${BUS_MAX})`;
        }, PERIOD);
    })();

    // Engine diagnostics — open with ?diag to log scsynth health every 3s. Used to
    // hunt timing/scheduler regressions (e.g. synth voices dropping over time): watch
    // audioHealthPct, scsynthSchedulerDropped/Lates, preschedulerLates, drift*.
    if (new URLSearchParams(location.search).has('diag')) {
        const KEYS = ['audioHealthPct','glitchCount','scsynthMessagesDropped',
            'scsynthSchedulerDepth','scsynthSchedulerPeakDepth','scsynthSchedulerDropped',
            'scsynthSchedulerLates','scsynthSchedulerMaxLateMs','preschedulerPending',
            'preschedulerLates','preschedulerRetryQueueSize','scsynthWasmErrors',
            'driftOffsetMs','clockOffsetMs','audioContextState'];
        setInterval(() => {
            if (!_scRef?.getMetrics) return;
            let m; try { m = _scRef.getMetrics() || {}; } catch (_) { return; }
            const o = {}; for (const k of KEYS) o[k] = m[k];
            const voices = clock._players ? [...clock._players.values()].filter(p => p._active).length : 0;
            console.log('[diag]', voices + 'v', JSON.stringify(o));
            log(`diag: health ${o.audioHealthPct}% · schedDrop ${o.scsynthSchedulerDropped} · schedLate ${o.scsynthSchedulerLates} · preLate ${o.preschedulerLates} · drift ${Math.round(o.driftOffsetMs||0)}ms`, 'info');
        }, 3000);
    }

    // Re-anchor the clock when the tab regains focus, so it resumes at tempo
    // instead of lurching after a background throttle.
    document.addEventListener('visibilitychange', () => { if (!document.hidden) clock.resync(); });

    log('crashDot loaded. Click "boot" to start audio.', 'info');
  </script>
</body>
</html>
